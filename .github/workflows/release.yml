name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:build

      - name: Verify tag matches package version
        run: |
          node -e "const v=require('./packages/plugin/package.json').version; const t=process.env.GITHUB_REF_NAME.replace(/^v/,''); if (v!==t) { console.error('tag '+t+' != package version '+v); process.exit(1) }"

      - name: Stage plugin folder, zip, tarball and checksums
        run: pnpm stage:release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.tgz dist/SHA256SUMS.txt \
            --title "DSHBot $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
